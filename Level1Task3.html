<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta http-equiv="Content-Type" content="text/html">
    <meta name="viewport" content="width=device-width">
	
	<title>Basic Calculator</title>
	
    <link rel="stylesheet" href="level1task3.css">
	
</head>

<body>

    <div class="calculator">
        <input type="text" id="result" readonly>
        <div class="btn_layout">
            <button class="clear_btn">C</button>
            <button class="operator_btn">/</button>
            <button class="operator_btn">*</button>
            <button class="operator_btn">-</button>
            <button class="number_btn">7</button>
            <button class="number_btn">8</button>
            <button class="number_btn">9</button>
            <button class="operator_btn">+</button>
            <button class="number_btn">4</button>
            <button class="number_btn">5</button>
            <button class="number_btn">6</button>
            <button class="equals_btn">=</button>
            <button class="number_btn">1</button>
            <button class="number_btn">2</button>
            <button class="number_btn">3</button>
            <button class="number_btn">0</button>
            <button class="number_btn">.</button>
        </div>
    </div>
	
    <script src="level1task3.js"></script>
	
</body>
</html>
